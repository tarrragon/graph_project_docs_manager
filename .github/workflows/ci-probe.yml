# CI 可執行面實測（0.5.0-W1-231 驗收第 3 項）。
# 只手動觸發；用途是記錄三組測試在 GitHub runner 的成敗與耗時，不是合併閘門。
name: ci-probe

on:
  workflow_dispatch:

jobs:
  flutter-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.1' # 與 .fvmrc 一致
          channel: stable
      - run: flutter pub get
      - run: flutter test

  hooks-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      # 部分 hook 測試會建立暫存 repo 並 commit，需要 git 身分
      - run: |
          git config --global user.name "ci-probe"
          git config --global user.email "ci-probe@example.invalid"
      - working-directory: .claude/hooks
        run: uv run --with pytest --with pyyaml pytest -q -rfE

  flutter-integration-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.1' # 與 .fvmrc 一致
          channel: stable
      - run: flutter pub get
      - run: flutter test integration_test -d macos
