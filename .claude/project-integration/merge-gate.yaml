# 合併閘門套件宣告（專案層，不隨 sync 同步）
# 宣告取代內建 Flutter 預設，故 flutter 與 line-board 兩個套件都必須寫出。
suites:
  # 格式檢查：只對本次改動的 .dart 檔執行，存量已於 482.2 一次性格式化（一律經 fvm）。
  dart-format:
    prefixes: [lib/, test/, integration_test/]
    command: [fvm, dart, format, --output=none, --set-exit-if-changed]
    changed_files: '\.dart$'
  flutter:
    prefixes: [lib/, test/, integration_test/, macos/, docs/spec/, assets/]
    files: [pubspec.yaml, pubspec.lock, l10n.yaml, analysis_options.yaml,
            .claude/project-integration/merge-gate.yaml]
    command: [fvm, flutter, test]
    artifacts:
      - path: .dart_tool/package_config.json
        generate: [fvm, flutter, pub, get]
  # 靜態分析：全專案、--fatal-infos（info 也擋，避免在 main 累積；基線 error/warning/info 皆 0）。
  dart-analyze:
    prefixes: [lib/, test/, integration_test/]
    files: [pubspec.yaml, pubspec.lock, analysis_options.yaml,
            .claude/project-integration/merge-gate.yaml]
    command: [fvm, dart, analyze, --fatal-infos]
    artifacts:
      - path: .dart_tool/package_config.json
        generate: [fvm, flutter, pub, get]
  # integration_test 冷建置約 75 秒，另立套件，僅在改動可能影響它時才跑（2026-10-21 用戶裁定）。
  # 觸發範圍：lib/、integration_test/、macos/、依賴鎖檔，加上其唯一的 test/ 相依檔。
  # corpus_snapshot.dart 為 integration_test 唯一依賴的 test/ 檔，故只列該檔而非整個 test/。
  flutter-integration:
    prefixes: [lib/, integration_test/, macos/]
    files: [pubspec.yaml, pubspec.lock, test/helpers/spec001/corpus_snapshot.dart]
    # 逐檔啟動：同次執行第二個 macOS App 確定性起不來，故經包裝腳本；每檔各自 300 秒逾時（非總預算）
    command: [python3, .claude/project-integration/run_integration_tests.py]
    # 通過時也會印 Failed to foreground app，不可當失敗訊號，正規式刻意不含它
    failure: 'Unable to start the app|Error waiting for a debug connection|integration 逾時'
    artifacts:
      - path: .dart_tool/package_config.json
        generate: [fvm, flutter, pub, get]
  # 研究腳本測試：common 為 pytest 風格（tmp_path、monkeypatch），unittest 收集為 0 個，
  # 故以 pytest 跑；pytest 也能收集 ui-vision-choice 的 unittest 類，單一 argv 即足夠。
  # weak-observer-ux 的測試需要 pillow；新增有測試的研究目錄時，同步列進 command 的目錄清單。
  # 紅綠由結束碼決定，failure 只用於列出失敗項；ERROR 行（收集或 fixture 失敗）一併列出。
  research-python:
    prefixes: [docs/research/]
    command: [uv, run, --quiet, --with, pytest, --with, pillow, python, -m, pytest, -q,
              -p, 'no:cacheprovider',
              docs/research/common, docs/research/ui-vision-choice, docs/research/weak-observer-ux]
    summary: '^\d+ (passed|failed)'
    failure: '^(FAILED|ERROR) '
  # line-board 不放 artifacts：閘門不跑 tsc（types 無頭生成命令未知）
  line-board:
    prefixes: [.claude/skills/line-board/]
    command: [claude, plugin, test, .claude/skills/line-board]
    summary: '^Ran \d+ tests across \d+ files'
    failure: '^\(fail\)'
  # tool/ 參照實作（187.1）：selftest／compute 決定性，紅綠由結束碼決定。
  # 需要 PyYAML，PATH 上的 python3 未裝，故經 uv 臨時注入（與 research-python 同法）。
  # freeze 需讀外部語料（~/project/flutter_balance），不納入閘門。
  # 宣告檔本身列入 files：分支新增宣告時，合併即跑一次新套件。
  tool-spec006-selftest:
    prefixes: [tool/]
    files: [.claude/project-integration/merge-gate.yaml]
    command: [uv, run, --quiet, --with, pyyaml, python, tool/spec006_reference.py, selftest]
    summary: '^SELFTEST PASSED'
    failure: '^(FAIL|FAILED|Traceback|AssertionError|SELFTEST FAILED)'
  tool-spec007-selftest:
    prefixes: [tool/, test/fixtures/spec007/]
    files: [.claude/project-integration/merge-gate.yaml]
    command: [uv, run, --quiet, --with, pyyaml, python, tool/spec007_reference.py, selftest]
    summary: '^selftest passed: \d+ groups'
    failure: '^(FAIL|FAILED|Traceback|AssertionError)'
  tool-spec007-compute:
    prefixes: [tool/, test/fixtures/spec007/]
    files: [.claude/project-integration/merge-gate.yaml]
    command: [uv, run, --quiet, --with, pyyaml, python, tool/spec007_reference.py, compute]
    summary: '^README matches frozen values'
    failure: '^(FAIL|FAILED|Traceback|AssertionError|MISMATCH)'
