# 合併閘門套件宣告（專案層，不隨 sync 同步）
# 宣告取代內建 Flutter 預設，故 flutter 與 line-board 兩個套件都必須寫出。
suites:
  flutter:
    prefixes: [lib/, test/, integration_test/, macos/, docs/, assets/]
    files: [pubspec.yaml, pubspec.lock, l10n.yaml, analysis_options.yaml]
    command: [fvm, flutter, test]
    artifacts:
      - path: .dart_tool/package_config.json
        generate: [fvm, flutter, pub, get]
  # integration_test 冷建置約 75 秒，另立套件，僅在改動可能影響它時才跑（2026-10-21 用戶裁定）。
  # 觸發範圍：lib/、integration_test/、macos/、依賴鎖檔，加上其唯一的 test/ 相依檔。
  # corpus_snapshot.dart 為 integration_test 唯一依賴的 test/ 檔，故只列該檔而非整個 test/。
  flutter-integration:
    prefixes: [lib/, integration_test/, macos/]
    files: [pubspec.yaml, pubspec.lock, test/helpers/spec001/corpus_snapshot.dart]
    # 逐檔啟動：同次執行第二個 macOS App 確定性起不來，故經包裝腳本
    command: [python3, .claude/project-integration/run_integration_tests.py]
    # 通過時也會印 Failed to foreground app，不可當失敗訊號，正規式刻意不含它
    failure: 'Unable to start the app|Error waiting for a debug connection'
    artifacts:
      - path: .dart_tool/package_config.json
        generate: [fvm, flutter, pub, get]
  # line-board 不放 artifacts：閘門不跑 tsc（types 無頭生成命令未知）
  line-board:
    prefixes: [tools/line-board/]
    command: [claude, plugin, test, tools/line-board]
    summary: '^Ran \d+ tests across \d+ files'
    failure: '^\(fail\)'
