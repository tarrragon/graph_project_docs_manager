  - version: "0.0.2"
    codename: "Intake"
    description: "設計與選型訪談，產出需求追蹤文件"
    status: "completed"
    proposals:
      - PROP-001
      - PROP-002
      - PROP-003
      - PROP-004
    worklog: null    # 訪談以對話進行，產物直接落為 PROP / SPEC / UC / EVT
    notes: |
      saas-tech-selection Stage 0-6 全程。產出 PROP-001~004（皆 confirmed）、
      SPEC-001（畫面狀態矩陣，狀態集合見該檔 §1-7，6 個 FR）、
      UC-01~06（皆含結構化 flow 區塊）、
      domain-map（訪談時 7 domain，0.0.3 新增 History 為第 8 個）、9 個 EVT、
      0.1 展示介面版型定案。

      六個 UC 的結構化 flow 使本專案具備成為 FlowStep 第二份獨立語料的條件，
      但升級判準另有第二條（doc CLI 須有建立與驗證支援）尚未滿足——該缺口
      已實際發作：39 個 FlowStep 中 37 個曾缺必填欄位而無機制察覺，
      2026-08-27 的多輪審查才發現並補齊。

  - version: "0.0.3"
    codename: "Toolkit"
    description: "第三方套件選型評估"
    status: "completed"
    worklog: "docs/work-logs/v0/v0.0/v0.0.3/"
    notes: |
      訪談階段未涵蓋的選型議題：markdown 渲染、markdown 編輯、
      git 變更記錄。以真實語料實測後定案，不憑套件描述決定。

      收尾另含三輪文件審查（17 個 frame、12 位 reviewer）：撤回
      「130 個 YAML 錯誤」的量測 artifact、修復 37 個 FlowStep 結構違規、
      SPEC-001 補上 94% 實際輸入的行為定義（FR-07）。待決由 5 項擴為 19 項，
      收束為 PROP-005 的版本序列。

  - version: "0.1.0"
    codename: "Shell"
    description: "展示介面：七個畫面與浮層的全部狀態皆可渲染，不串真實資料"
    status: "active"
    proposals:
      - PROP-004
      - PROP-005
    worklog: "docs/work-logs/v0/v0.1/v0.1.0/"
    notes: |
      整合測試：SPEC-001 §1-7 的全部狀態皆能渲染且不溢位；該捲動處能捲動、
      該換頁處能換頁、該拖拉處能拖拉。與資料正確性解耦，後續加邏輯時持續有效。

      假資料採真實 repo 快照（非生成器）——生成器產的損壞形態是想像的，
      而 0.0.3 的審查已證明想像的損壞形態可能整批是假的。
      泳道本版只做靜態版型，布局演算法後推至 Layout 接真資料的版本。

      實作中撞到 SPEC-001 未預估的文件變體或畫面情況時，開 0.1.x 的票修正
      並回填狀態表，不回頭改版本規劃。

  - version: "0.2.0"
    codename: "Gate"
    description: "Workspace + Schema：三路 gate，17 個真實專案各自進入正確分支"
    status: "planned"
    proposals:
      - PROP-002
      - PROP-003
      - PROP-005
    worklog: "docs/work-logs/v0/v0.2/v0.2.0/"
    notes: |
      範圍由 PROP-005「版本序列」§0.2 完整定義，故依本檔開頭第三類登記：
      整合測試為本機 17 個有 .claude/ 的專案各自進入正確的 gate 分支
      （不是框架專案 6 / 無可消費的型別表 10 / 可載入 1）；斷言來源為
      SPEC-001 FR-04、FR-07 與 Gate 三問對照；阻擋清單為無。

      PROP-005 稱其為本 App 最有價值的整合測試——測資是真實專案、答案由
      實測得出、涵蓋 94% 過去沒有定義行為的輸入，且指名的是外部固定值，
      沒有省力路徑可走。

      本條目登記範圍，不代表已排入實作。實作順序仍待 0.1.0 收斂後決定。
