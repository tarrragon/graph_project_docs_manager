# graph_project_docs_manager - TodoList
# 結構化版本管理與任務追蹤
#
# 此檔案是版本索引的 Source of Truth。
# get_current_version() 優先解析此檔案中 status=active 的版本。
#
# 版本可以預先登記（2026-09-29 廢除「不預先登記尚未定案範圍的未來版本」，
# 見 docs/tech-decisions.md 同日補記）：major 起始時登記其下固定的 minor
# 清單，minor 完成後分診並登記固定數量的 topic patch。原規則的意圖——不以
# 版本標籤代替討論——改由規劃程序承接：任何項目進入一個尚未開工的版本，
# 都須附「經討論後決定放在此處」的記錄。
#
# 版本契約（2026-09-29，見 docs/tech-decisions.md〈版本契約必填內容〉）：每個版本開工前，
# notes 須寫明以下各欄，實作後以實測對照驗證：
#   1. topic 與缺陷／範圍清單
#   2. 預期變更：預期變紅的測試與調整方式、預期改變的數值、預期不變的項目
#   3. 驗證方式：每項行為變更標「機械驗證」（測試、日誌或系統狀態查詢）或「人工實測」；
#      人工實測只限權限類平台事實（通知授權、TCC 隱私權限、簽章／公證、輔助使用、sandbox）
#   4. 人工實測項的時段與前置檢查：實例數為 1、同 bundle id 只登記一份現存 .app、
#      觀測管道已接上（DevTools Logging／log show）
#   5. 以日誌取代目視的行為：列出必須產生的日誌事件，事件內容為結果值（如 scroll 完成後
#      visible=true、下一幀 hasFocus），不記「已發出請求」
#
# 版本登記規則（patch 不需 PROP、minor 第三類門檻）的正文在
# .claude/pm-rules/version-progression.md〈版本生命週期〉的〈版本登記規則〉表
# （2026-09-23 自本檔頭搬入框架，使其他專案同樣拿得到）；本檔只登記，不定義規則。

