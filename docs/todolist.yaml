# graph_project_docs_manager - TodoList
# 結構化版本管理與任務追蹤
#
# 此檔案是版本索引的 Source of Truth。
# get_current_version() 優先解析此檔案中 status=active 的版本。
#
# 本專案不預先將功能劃分到 v1 / v2：所有應做的功能先討論清楚並文件化，
# 再依序安排實作順序。本檔登記「已經發生」「進行中」，以及「範圍已由
# confirmed 提案完整定義」的版本；不預先登記尚未定案範圍的未來版本。
#
# 第三類的判斷標準（2026-08-27 補）：該版本的整合測試、斷言來源、阻擋
# 清單三者皆已在提案中寫定。滿足者才登記——登記的是已定案的事實，不是
# 對未來的規劃。原文僅列前兩類，與「不預先登記尚未定案範圍」的但書不
# 一致：但書的排除對象是「範圍未定」，而非「尚未開始」。0.2.0 的範圍由
# PROP-005 完整定義（阻擋為無）卻因前兩類的字面而無處登記，使 confirmed
# 提案 PROP-002 / PROP-003 的 target_version 指向不存在的條目。
#
# patch 版本登記規則（2026-09-23 補，scope 凍結模型落地後新增）：
# x.y.z（z>0）的 patch 版本不受上述第三類判準約束，不需要 PROP 定義範圍——
# patch 版本的範圍由上層 minor（x.y.0）scope 凍結後，凍結閘門路由至此的票
# 組成，不是預先規劃的功能範圍。登記時 notes 只需寫「範圍 = 凍結閘門路由
# 至此的票；整合測試 = 上層 minor（x.y.0）的整合測試仍通過」，不需另立
# 整合測試或阻擋清單。scope 凍結分流規則見
# .claude/pm-rules/version-progression.md〈版本生命週期〉。

meta:
  project: "graph_project_docs_manager"
  architecture: "Flutter macOS 桌面（見 CLAUDE.md 技術選型與架構決策）"
  last_updated: "2026-09-23"
  maintainer: "rosemary-project-manager"

versions:
  - version: "0.0.1"
    codename: "Foundation"
    description: "Flutter 專案骨架、FVM 版本釘選、雙層測試、多語系"
    status: "completed"
    worklog: null    # 0.0.1 在 ticket 系統導入前完成，無 worklog 目錄
    notes: |
      建立 macOS 桌面基礎架構。發布通路自 Mac App Store 改為
