      - enter-gap-report
      - view-categories
      - locate-item
      - open-source-file
    alt_scenarios:
      - rescan
      - no-gaps
    tests:
      - test/unit/screens/gap_report_test.dart

# 水平 domain 規則軸：docs/domain-map.md §3 的 8 個 bundle。
# invariants 取自該表「唯一變更理由」欄；layer 取自 §2 分層圖。
# tests 全數為空——8 個 domain 的業務邏輯尚未實作（專案現處於
# UI/token/元件庫基礎建設階段，僅 Workspace 有部分程式碼
# lib/workspace/workspace_repository.dart 且無專屬測試檔），
# 這是設計期落差，非缺陷；見 Solution「規格有而測試無」表。
domain_bundle_tests:
  - bundle: Workspace
    layer: L0
    invariants:
      - 資料夾存取方式改變是唯一合法變更理由（domain-map.md §3）
    tests: []

  - bundle: Schema
    layer: L0
    invariants:
      - 上游 schema 格式或版本語意改變是唯一合法變更理由（domain-map.md §3）
    tests: []

  - bundle: Corpus
    layer: L1
    invariants:
      - 文件格式或解析寬容度改變是唯一合法變更理由（domain-map.md §3）
      - frontmatter 邊界判定採逐行語意，既有語料解析失敗數應為 0（domain-map.md §7）
    tests: []

  - bundle: Graph
    layer: L2
    invariants:
      - 圖語意改變（如 symmetric union 規則）是唯一合法變更理由（domain-map.md §3）
    tests: []

  - bundle: TicketDetail
    layer: L2
    invariants:
      - ticket 的 5W1H 結構語意改變是唯一合法變更理由（domain-map.md §3）
    tests: []

  - bundle: Diagnostics
    layer: L2
    invariants:
      - 「什麼算破洞」的定義改變是唯一合法變更理由（domain-map.md §3）
      - 只有落在節點 carrier 路徑下卻缺 frontmatter 的檔案才進破洞報告（domain-map.md §7）
    tests: []

  - bundle: History
    layer: L2
    invariants:
      - git 查詢方式或歷史語意改變是唯一合法變更理由（domain-map.md §3）
    tests: []

  - bundle: Layout
    layer: L3
    invariants:
      - 布局演算法或版型規則改變是唯一合法變更理由（domain-map.md §3）
    tests: []

# 資料契約軸：跨語言/平台/token 層的不變式，皆已有契約測試覆蓋。
data_contract_tests:
  - contract_ref: CLAUDE.md §6 minSize（960x640）／macos/Runner/MainFlutterWindow.swift
    description: Dart kMinWindowSize 與 Swift minimumSize 須一致，否則整合測試全綠但實機拉窄後跑版
    tests:
      - test/window_size_contract_test.dart
      - integration_test/app_test.dart

  - contract_ref: CLAUDE.md §6 App Sandbox 關閉
    description: sandbox 關閉為能力性約束——開啟後 Process.run 無法執行專案內的 doc CLI
    tests:
      - test/entitlements_contract_test.dart

  - contract_ref: SPEC-002 §已知的顏色分佈／無障礙對比例外（2026-09-02）
    description: AppColors 語意色組合須達 WCAG 2.x 相對亮度對比門檻
    tests:
      - test/unit/tokens/colors_test.dart

  - contract_ref: 0.1.0-W1-047／0.1.0-W1-044.1
    description: lib/tokens/layout.dart 語意名回溯 NeedsContext 記錄的原始實測值
    tests:
