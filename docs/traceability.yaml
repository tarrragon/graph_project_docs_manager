version: "1.0"

# 本檔結構為 doc skill 的 TRACEABILITY_SCHEMA（唯一權威：
# .claude/skills/doc/doc_system/core/tracking_schema.py）。頂層鍵、
# 每軸的必填/選填欄位一律以該常數為準，禁止在本檔另立新頂層鍵或
# 猜測欄位名——test_tracking_schema_conformance.py 會在本檔存在後
# 對頂層鍵與 domain_bundle_tests / data_contract_tests 逐條目做
# 真實一致性檢查。
#
# 回填依據與缺口分析：0.1.0-W3-076 Solution。W3-075/W3-083 定案的
# 「規格條目為單位、六來源類別、九欄契約」設計是測試對象目錄
# （test-object-catalogue.md）的方法論，與本檔的四軸結構是不同形狀
# 的兩份產出——本檔不強行塞入該設計的欄位，兩者的落差與後續處置
# 見 0.1.0-W3-076 Solution「schema 落差說明」。

mappings:
  - spec: SPEC-001
    usecase: UC-01
    title: 開啟專案並抵達可用狀態
    main_flow:
      - select-folder
      - load-schema
      - parse-nodes
      - reach-domain-view
    alt_scenarios:
