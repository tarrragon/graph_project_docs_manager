      - empty-graph
      - schema-rejected
    tests: []

  - spec: SPEC-001
    usecase: UC-02
    title: 依 domain 盤點變更影響面
    main_flow:
      - locate-domain
      - read-traversal-count
      - switch-to-swimlane
      - inspect-steps
    alt_scenarios:
      - matrix-overview-only
      - enter-from-ticket
      - flow-not-structured
    tests: []

  - spec: SPEC-001
    usecase: UC-03
    title: 理解一條 flow 貫穿哪些 domain
    main_flow:
      - select-uc
      - view-steps
      - jump-to-node
    alt_scenarios:
      - jump-to-domain
      - inspect-event-flow
      - flow-block-absent
    tests: []

  - spec: SPEC-001
    usecase: UC-04
    title: 追溯一項需求的實現鏈
    main_flow:
      - select-proposal
      - expand-downstream
      - inspect-status
      - jump-to-detail
    alt_scenarios:
      - reverse-trace
      - chain-broken
    tests:
      - test/unit/screens/traceability_test.dart

  - spec: SPEC-001
    usecase: UC-05
    title: 找出被阻擋的工作
    main_flow:
      - enter-ticket-list
      - trigger-load
      - switch-to-topic
      - locate-blocked
    alt_scenarios:
      - filter-in-list-mode
      - cancel-loading
      - damaged-tickets
    tests: []

  - spec: SPEC-001
    usecase: UC-06
    title: 找出並修復文件破洞
